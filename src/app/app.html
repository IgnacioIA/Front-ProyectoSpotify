<app-header
  [menuAbierto]="menuAbierto"
  (menuToggle)="alternarMenu()"
  [filtroTexto]="busqueda.texto()"
  (filtroTextoChange)="busqueda.texto.set($event)"
  (tituloClick)="irAInicio()" />

<div class="app-cuerpo">
  <app-sidebar [abierto]="menuAbierto" (seleccion)="seleccionar($event)" (cerrar)="cerrarMenu()" />

  <main class="app-contenido">
    <router-outlet />
  </main>
</div>

<!-- Fuera del router-outlet para que la reproducción continúe al cambiar de página -->
<app-player-bar />
