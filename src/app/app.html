<div style="background-color: #121212; color: white; min-height: 100vh; padding: 40px 40px 120px 40px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <header style="margin-bottom: 30px; border-bottom: 1px solid #282828; padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h1 style="color: #1DB954; font-size: 2.5rem; margin: 0;">🎧 Mi Spotify MVP</h1>
      <p style="color: #b3b3b3; margin-top: 8px;">Conectado exitosamente</p>
    </div>
    
    <div style="display: flex; gap: 12px; align-items: center;">
      <button (click)="abrirModalPlaylist()" 
              style="background: #242424; color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
        ➕ Crear Playlist
      </button>

      <button (click)="toggleFiltroFavoritas()" 
              [style.background]="soloFavoritas ? '#1DB954' : '#242424'"
              [style.color]="soloFavoritas ? 'black' : 'white'"
              style="border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; font-weight: bold;">
        💚 Favoritas
      </button>

      <input type="text" 
             [(ngModel)]="filtroTexto" 
             placeholder="Buscar canción o artista..." 
             style="padding: 10px 16px; border-radius: 20px; border: none; background: #242424; color: white; width: 220px; outline: none; font-size: 0.9rem;">
    </div>
  </header>

  <!-- SECCIÓN DE PLAYLISTS CREADAS -->
  <div style="margin-bottom: 30px;" *ngIf="playlists.length > 0">
    <h3 style="font-size: 1.1rem; color: #b3b3b3; margin-bottom: 12px;">Tus Playlists</h3>
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button (click)="verTodasLasCanciones()"
              [style.background]="!playlistSeleccionada && !soloFavoritas ? '#1DB954' : '#181818'"
              [style.color]="!playlistSeleccionada && !soloFavoritas ? 'black' : 'white'"
              style="border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;">
        🎵 Todas
      </button>
      <button *ngFor="let pl of playlists" 
              (click)="seleccionarPlaylist(pl)"
              [style.background]="playlistSeleccionada?.id === pl.id ? '#1DB954' : '#181818'"
              [style.color]="playlistSeleccionada?.id === pl.id ? 'black' : 'white'"
              style="border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;">
        📁 {{ pl.nombre }} ({{ pl.canciones.length }})
      </button>
    </div>
  </div>

  <section>
    <h2 style="font-size: 1.5rem; margin-bottom: 20px;">
      {{ playlistSeleccionada ? 'Playlist: ' + playlistSeleccionada.nombre : (soloFavoritas ? 'Tus Canciones Favoritas' : 'Canciones Disponibles') }}
    </h2>

    <div style="display: flex; flex-direction: column; gap: 12px; max-width: 800px;">
      <div *ngFor="let cancion of cancionesFiltradas" 
           style="display: flex; align-items: center; justify-content: space-between; background: #181818; padding: 12px 20px; border-radius: 8px; position: relative;">
        
        <div style="display: flex; align-items: center; gap: 16px;">
          <button (click)="reproducirCancion(cancion)" 
                  style="background: #1DB954; border: none; border-radius: 50%; width: 40px; height: 40px; color: black; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            {{ cancionActual?.id === cancion.id && reproduciendo ? '⏸' : '▶' }}
          </button>
          <div>
            <div style="font-weight: bold; font-size: 1.1rem; color: #fff;">{{ cancion.titulo }}</div>
            <div style="color: #b3b3b3; font-size: 0.9rem; margin-top: 4px;">{{ cancion.artista?.nombre }}</div>
          </div>
        </div>

<router-outlet />
<app-player-bar></app-player-bar>
