<header class="header">
  <!-- Izquierda: botón del menú lateral y título -->
  <div class="header__izquierda">
    <button
      type="button"
      class="header__menu"
      aria-controls="menu-lateral"
      [attr.aria-expanded]="menuAbierto"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      (click)="menuToggle.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <line x1="4" y1="17" x2="20" y2="17" />
      </svg>
    </button>
    <h1 class="header__titulo">
      <button type="button" class="header__titulo-boton" (click)="tituloClick.emit()">
        🎧 Mi Spotify MVP
      </button>
    </h1>
  </div>

  <!-- Centro: buscador global -->
  <div class="header__buscador" role="search">
    <button type="button" class="header__buscar" aria-label="Buscar" (click)="buscar(campo.value)">
      <svg class="header__lupa" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="16.5" y1="16.5" x2="21" y2="21" />
      </svg>
    </button>
    <input
      #campo
      type="search"
      class="header__input"
      aria-label="Buscar canción, artista o género"
      placeholder="Buscar canción, artista o género..."
      autocomplete="off"
      [ngModel]="filtroTexto"
      (ngModelChange)="alEscribir($event)"
      (keydown.enter)="buscar(campo.value)">
  </div>

  <!-- Derecha: acceso de usuario según el estado de AuthService -->
  <div class="header__usuario">
    @if (authService.usuario(); as usuario) {
      <a
        class="header__perfil"
        routerLink="/perfil"
        routerLinkActive="header__perfil--activo"
        [attr.aria-label]="'Perfil de ' + usuario.nombreUsuario">
        <span class="header__avatar" aria-hidden="true">👤</span>
        <span class="header__nombre">{{ usuario.nombreUsuario }}</span>
      </a>
      <button type="button" class="header__accion" (click)="cerrarSesion()">Cerrar sesión</button>
    } @else {
      <a class="header__accion" routerLink="/registro">Registrarse</a>
      <a class="header__accion header__accion--principal" routerLink="/login">Iniciar sesión</a>
    }
  </div>
</header>
