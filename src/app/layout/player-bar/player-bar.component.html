<!-- BARRA REPRODUCTORA INFERIOR -->
@if (reproductor.cancionActual(); as cancionActual) {
  <div
    style="position: fixed; bottom: 0; left: 0; right: 0; background: #181818; border-top: 1px solid #282828; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; z-index: 1000;">

    <div style="display: flex; align-items: center; gap: 16px; width: 35%;">
      <div style="font-size: 1.8rem;">🎵</div>
      <div>
        <div style="font-weight: bold; color: white; font-size: 1rem;">{{ cancionActual.titulo }}</div>
        <!-- Nombre del artista clickeable -->
        <div (click)="irAlArtista()"
          style="color: #b3b3b3; font-size: 0.85rem; cursor: pointer;"
          onmouseover="this.style.color='white'; this.style.textDecoration='underline'"
          onmouseout="this.style.color='#b3b3b3'; this.style.textDecoration='none'">
          {{ cancionActual.artista?.nombre }}
        </div>
      </div>

      <button (click)="toggleFavorito()"
        [style.color]="cancionActual.favorito ? '#1DB954' : '#b3b3b3'"
        style="background: transparent; border: none; font-size: 1.2rem; cursor: pointer;">
        {{ cancionActual.favorito ? '💚' : '🤍' }}
      </button>
    </div>

    <!-- Controles centrales y volumen -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 40%;">
      <button (click)="reproductor.alternarReproduccion()"
        style="background: #1DB954; border: none; border-radius: 50%; width: 38px; height: 38px; color: black; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        {{ reproductor.reproduciendo() ? '❚❚' : '▶' }}
      </button>
      <div style="display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #b3b3b3;">
        <span>{{ formatearDuracion(reproductor.tiempoActual()) }}</span>
        <div
          style="flex-grow: 1; background: #4d4d4d; height: 4px; border-radius: 2px; position: relative; overflow: hidden;">
          <div [style.width.%]="(reproductor.tiempoActual() / cancionActual.duracion) * 100"
            style="background: #1DB954; height: 100%; transition: width 0.3s linear;"></div>
        </div>
        <span>{{ formatearDuracion(cancionActual.duracion) }}</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 25%;">
      <span style="color: #b3b3b3; font-size: 0.9rem;">🔊</span>
      <input type="range" min="0" max="1" step="0.01" value="1" (input)="onVolumeChange($event)"
        style="width: 90px; accent-color: #1DB954; cursor: pointer;">
    </div>

  </div>
}
